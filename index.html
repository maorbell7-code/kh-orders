<script>
// items: [{s, x, y, w}] from pdf.js (x = left edge, y = baseline, PDF units)
function parsePriceItems(items) {
  const isNum = s => /^\d+(\.\d+)?$/.test(s.trim());
  const clean = items.map(i => ({ s: i.s, t: i.s.trim(), x: i.x, y: Math.round(i.y * 2) / 2, w: i.w || 0 })).filter(i => i.t);
  // date
  let date = null;
  for (const i of clean) { const m = i.t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) { date = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; break; } }
  // price columns: x positions where many numbers line up
  const bins = {};
  for (const i of clean) if (isNum(i.t)) { const b = Math.round((i.x + i.w) / 6); bins[b] = (bins[b] || 0) + 1; }
  const cand = Object.entries(bins).map(([b, n]) => ({ x: b * 6, n })).sort((a, b) => b.n - a.n);
  const cols = [];
  for (const c of cand) { if (c.n < 8) break; if (cols.every(k => Math.abs(k - c.x) > 40)) cols.push(c.x); if (cols.length === 4) break; }
  cols.sort((a, b) => b - a); // right to left
  // group rows by y
  const rows = new Map();
  for (const i of clean) { let key = [...rows.keys()].find(k => Math.abs(k - i.y) < 2); if (key === undefined) { key = i.y; rows.set(key, []); } rows.get(key).push(i); }
  const ys = [...rows.keys()].sort((a, b) => b - a);
  const skip = /^(מחיר|תאור מוצר|תאור\s*מוצר)$/;
  const cats = cols.map(() => '');
  const out = [];
  for (const y of ys) {
    const row = rows.get(y);
    cols.forEach((px, ci) => {
      const left = px - 16, right = ci === 0 ? 1e9 : cols[ci - 1] - 10;
      const cell = row.filter(i => i.x >= left && i.x < right).sort((a, b) => b.x - a.x);
      if (!cell.length) return;
      const priceItem = cell.find(i => isNum(i.t) && Math.abs(i.x + i.w - px) < 14);
      const rest = cell.filter(i => i !== priceItem);
      let name = '';
      let prev = null;
      for (const i of rest) {
        const gap = prev ? prev.x - (i.x + i.w) : 0;
        name += (prev && gap > 1.2 && !/^["'׳״]/.test(i.t) && !/["'׳״]$/.test(name) ? ' ' : '') + i.t;
        prev = i;
      }
      name = name.replace(/\s+/g, ' ').trim();
      if (!name) return;
      if (!priceItem) {
        if (skip.test(name) || /\d{2}\/\d{2}\/\d{4}|\d{2,3}-\d{6,7}/.test(name)) return;
        name = name.replace(/מחיר/g, '').replace(/\s*\/\s*/g, '/').replace(/\s+/g, ' ').trim();
        if (name) cats[ci] = name;
        return;
      }
      out.push({ n: name, c: cats[ci] || 'כללי', p: parseFloat(priceItem.t), u: guessUnit(name, cats[ci]) });
    });
  }
  // unique names within category
  const seen = {};
  for (const it of out) { const k = it.c + '|' + it.n; seen[k] = (seen[k] || 0) + 1; if (seen[k] > 1) it.n += ` (${seen[k]})`; }
  return { date, cols, items: out };
}
function guessUnit(name, cat) {
  if (/קרטון|קר'|\(\s*\d+\s*יח/.test(name)) return 'קרטון';
  if (/(^|[\s(])יח/.test(name)) return "יח'";
  if (/ק"ג|קילו|תפזורת/.test(name)) return 'ק"ג';
  if (['ירק', 'תבלינים', 'נבטים', 'מהדרין'].includes(cat) && /ארוז|גוש/.test(name)) return "יח'";
  return 'ק"ג';
}

<script>
const PASS = null; // checked on the server
const ROLES = { mz: 'מזומ"ש', buy: 'רכש' };
const STATUS = { draft: 'טיוטה', sent: 'נשלחה לרכש', viewed: 'נצפתה ע"י רכש', handled: 'טופלה' };
const UNITS = ['ק"ג', "יח'", 'מארז', 'קרטון', 'ארגז', 'מגש'];
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '₪' + (Math.round(n * 100) / 100).toLocaleString('he-IL', { maximumFractionDigits: 2 });
const qfmt = n => (Math.round(n * 100) / 100).toLocaleString('he-IL', { maximumFractionDigits: 2 });
const keyOf = it => it.c + '|' + it.n;
const norm = s => String(s).replace(/["'׳״]/g, '').toLowerCase();
const todayISO = (d = 0) => { const t = new Date(); t.setDate(t.getDate() + d); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
const dmy = iso => { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return `${+d}/${+m}/${y.slice(2)}`; };
const dayName = iso => iso ? new Date(iso + 'T12:00').toLocaleDateString('he-IL', { weekday: 'long' }) : '';
const when = iso => iso ? new Date(iso).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

const S = {
  role: window.appHasLogin && !window.appHasLogin() ? null : store.get('mz_role'),
  tab: null, db: null, dbState: 'loading',
  catalogs: {}, pricesLoaded: false, orders: [], ordersLoaded: false, plSup: null, pendingSup: null,
  cart: loadCart(), search: '', cat: 'הכל', view: 'list', openId: null,
  buyFilter: 'open', plSearch: '', upload: null, armed: null, seen: {},
  suppliers: null, legacySupplier: null, editSupplier: false, waPending: null, supSel: store.get('mz_sup')
};
const seenKey = o => o.status + (o.edited ? '*' : '') + 'S'.repeat(sentList(o).length);
function suppliers() { return S.suppliers?.list || (S.legacySupplier ? [{ id: 'sup1', ...S.legacySupplier }] : []); }
function sentList(o) { return o.sentTo || (o.supplierSentAt ? [{ name: o.supplierName || 'ספק', at: o.supplierSentAt }] : []); }
function curSup() { const l = suppliers(); return l.find(s => s.id === S.supSel) || l[0] || null; }
function emptyCart() { return { id: null, delivery: todayISO(1), notes: '', lines: {}, extra: [], sup: '' }; }
function supOptions(selected, emptyLabel) {
  return `<option value="">${esc(emptyLabel)}</option>` + suppliers().map(s => `<option value="${esc(s.id)}" ${s.id === selected ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
}
const supName = id => suppliers().find(s => s.id === id)?.name || '';
function loadCart() {
  let c; try { c = JSON.parse(store.get('mz_cart')); } catch (e) { c = null; }
  c = c || emptyCart();
  if (!c.sup && Object.keys(c.lines || {}).length) c.sup = 'pini'; // carts from before suppliers had their own lists
  return c;
}
// which supplier's catalog the current screen is about

async function connect() {
  let db = null;
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { S.dbState = 'none'; render(); return; }
  S.db = db; S.dbState = 'ok';
  const timer = setTimeout(() => { if (!S.pricesLoaded || !S.ordersLoaded) { S.dbState = 'slow'; render(); } }, 10000);
  db.collection('catalog').onSnapshot(snap => {
    const c = {}; snap.docs.forEach(d => c[d.id] = d.data()); S.catalogs = c;
    if (!snap.metadata.fromCache) { S.pricesLoaded = true; if (S.ordersLoaded) clearTimeout(timer); if (S.dbState === 'slow') S.dbState = 'ok'; }
    onData('prices');
  }, () => { S.pricesLoaded = true; onData('prices'); });
  db.collection('orders').orderBy('createdAt', 'desc').limit(500).onSnapshot(snap => {
    const first = !S.ordersLoaded && !Object.keys(S.seen).length;
    const next = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!first) notifyChanges(next);
    next.forEach(o => S.seen[o.id] = seenKey(o));
    S.orders = next;
    if (!snap.metadata.fromCache) { S.ordersLoaded = true; if (S.pricesLoaded) clearTimeout(timer); if (S.dbState === 'slow') S.dbState = 'ok'; }
    onData('orders');
  }, () => { S.ordersLoaded = true; onData('orders'); });
  const supChanged = () => {
    if (S.role === 'buy' && S.tab === 'orders' && !S.editSupplier) renderMain();
    const sel = $('#cartSup'); if (sel) sel.innerHTML = supOptions(S.cart.sup, 'בחירת ספק');
  };
  db.doc('settings/suppliers').onSnapshot(snap => { S.suppliers = snap.exists ? snap.data() : null; supChanged(); }, () => {});
  db.doc('settings/supplier').onSnapshot(snap => { S.legacySupplier = snap.exists ? snap.data() : null; supChanged(); }, () => {});
}
function notifyChanges(next) {
  for (const o of next) {
    const was = S.seen[o.id]; const now = seenKey(o);
    if (was === now) continue;
    const sl = sentList(o);
    if (S.role === 'mz' && was && sl.length > (was.match(/S/g) || []).length) { toast(`הזמנה ${o.num} נשלחה ל${sl[sl.length - 1].name}`); continue; }
    if (S.role === 'buy') {
      if (o.status === 'sent' && (!was || was.startsWith('draft'))) toast(`הזמנה חדשה ${o.num}${o.supplierName ? ` ל${o.supplierName}` : ''} לאספקה ב-${dmy(o.delivery)}`);
      else if (o.status === 'sent' && o.edited) toast(`הזמנה ${o.num} עודכנה ע"י מזומ"ש`);
    } else if (S.role === 'mz' && was) {
      if (o.status === 'viewed' && !was.startsWith('viewed')) toast(`רכש צפה בהזמנה ${o.num}`);
      if (o.status === 'handled' && !was.startsWith('handled')) toast(`רכש סימן את הזמנה ${o.num} כטופלה`);
    }
  }
}

async function write(fn, okMsg) {

let xlsxReady = null;
function loadXlsx() {

  const W = [18, 32, 8, 8, 12, 12, 26];
  if (orders.length > 1) {
    const agg = {};
    for (const o of orders) for (const l of o.lines || []) {
      const k = l.c + '|' + l.n + '|' + l.u;
      const a = agg[k] = agg[k] || { c: l.c, n: l.n, u: l.u, p: l.p, q: 0, from: [] };
      a.q += l.q; a.from.push(o.num);
    }
    const rows = [[`סיכום מאוחד · ${orders.length} הזמנות`], [], ['קטגוריה', 'פריט', 'כמות', 'יחידה', 'מחיר ליחידה', 'סה"כ', 'מהזמנות']];
    let total = 0;
    for (const a of Object.values(agg).sort((x, y) => x.c.localeCompare(y.c, 'he') || x.n.localeCompare(y.n, 'he'))) {
      const t = a.p ? Math.round(a.p * a.q * 100) / 100 : ''; total += t || 0;
      rows.push([a.c, a.n, Math.round(a.q * 100) / 100, a.u, a.p || '', t, [...new Set(a.from)].join(', ')]);
    }
    rows.push([], ['', 'סה"כ משוער', '', '', '', Math.round(total * 100) / 100]);
    XLSX.utils.book_append_sheet(wb, sheetOf(XLSX, rows, W), 'סיכום מאוחד');
  }
  const used = {};
  for (const o of orders) {
    let name = String(`${o.num} ${dmy(o.delivery).replace(/\//g, '.')}`).slice(0, 28);
    if (used[name]) name = name.slice(0, 25) + ' ' + (++used[name]); else used[name] = 1;
    XLSX.utils.book_append_sheet(wb, sheetOf(XLSX, orderRows(o), W), name);
  }

  try { await dl.save({ filename, data }); toast('הקובץ נשמר'); }
  catch (e) { if (e?.code !== 'declined') toast(e?.code === 'rate_limited' ? 'יש כבר חלון שמירה פתוח' : 'השמירה לא הצליחה'); }
}

function buildFinal(up) {

  const fileItems = up.items.map(i => { const o = byName[norm(i.n)]; return { n: i.n, c: i.c || o?.c || 'כללי', p: i.p, u: i.u || o?.u || guessUnit(i.n, i.c) }; });

  return `<div class="card" style="display:grid;gap:12px">
    <div class="section-title">בדיקה לפני עדכון המחירון של ${esc(supName(plSup()))}</div>
    <div class="muted">${esc(up.fileName)} · ${up.items.length} שורות נקראו מהקובץ</div>
    ${has ? `<div class="row-flex"><span style="font-weight:700">מוצרים שלא מופיעים בקובץ:</span><div class="seg">
      <button data-act="upMode" data-mode="merge" aria-pressed="${up.mode === 'merge'}">להשאיר</button>
      <button data-act="upMode" data-mode="replace" aria-pressed="${up.mode === 'replace'}">להסיר מהמחירון</button></div></div>` : ''}
    <div class="stats"><span class="stat">אחרי העדכון <b>${final.length}</b> מוצרים</span>${has ? `<span class="stat">התייקרו <b>${ups}</b></span><span class="stat">הוזלו <b>${downs}</b></span><span class="stat">חדשים <b>${d.added.length}</b></span><span class="stat">יוסרו <b>${d.removed.length}</b></span>` : ''}</div>
    <label class="field" style="max-width:240px">תאריך המחירון<input class="txt" type="date" id="upDate" value="${esc(up.date || todayISO())}"></label>
    ${rows ? `<div class="tbl-wrap"><table><thead><tr><th>פריט ששינה מחיר</th><th class="n">היה</th><th class="n">עכשיו</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
    ${d.added.length ? `<div class="muted"><b>חדשים:</b> ${d.added.slice(0, 30).map(i => esc(i.n)).join(' · ')}${d.added.length > 30 ? ' …' : ''}</div>` : ''}
    ${d.removed.length ? `<div class="muted"><b>יוסרו:</b> ${d.removed.slice(0, 30).map(i => esc(i.n)).join(' · ')}${d.removed.length > 30 ? ' …' : ''}</div>` : ''}
    <div class="row-flex"><button class="btn primary" data-act="publishPl">עדכון המחירון</button><button class="btn" data-act="cancelUp">ביטול</button></div>
  </div>`;
}
let pdfjsReady = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function loadPdfJs() {
  if (!pdfjsReady) pdfjsReady = (async () => {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    await loadScript(base + 'pdf.min.js');
    await loadScript(base + 'pdf.worker.min.js'); // runs the parser on the page thread
    return window.pdfjsLib;
  })();
  return pdfjsReady;
}
async function handleFile(file) {
  const err = $('#upErr'); if (err) err.textContent = 'קורא את הקובץ…';
  const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
  try {
    const r = isPdf ? await readPdf(file) : await readSheet(file);
    if (!r.items.length) throw new Error('empty');
    S.upload = { fileName: file.name, date: r.date, items: r.items, mode: isPdf ? 'replace' : 'merge' };
    renderMain();
  } catch (e) {
    const el = $('#upErr'); if (el) el.textContent = isPdf
      ? 'לא הצלחתי לקרוא מחירים מה-PDF. ייתכן שהמבנה שלו שונה מהמחירון של פיני. נסו קובץ אקסל עם עמודות "פריט" ו"מחיר".'
      : 'לא הצלחתי לקרוא את האקסל. ודאו שיש עמודה "פריט" (או "מוצר") ועמודה "מחיר".';
  }
}
async function readPdf(file) {
  const pdfjs = await loadPdfJs();
  const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const items = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    for (const i of tc.items) items.push({ s: i.str, x: i.transform[4], y: i.transform[5] - (p - 1) * 2000, w: i.width });
  }
  const r = parsePriceItems(items);
  if (r.items.length < 5) throw new Error('few');
  return r;
}
function sheetItems(rows) {
  const find = (row, re) => row.findIndex(c => re.test(String(c).trim()));
  let h = -1, cN = 0, cP = 1, cU = -1, cC = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const n = find(rows[i], /פריט|מוצר|^שם|תאור|תיאור/), p = find(rows[i], /מחיר/);
    if (n >= 0 && p >= 0) { h = i; cN = n; cP = p; cU = find(rows[i], /יחיד|^יח/); cC = find(rows[i], /קטגור|סוג|מחלק/); break; }
  }
  const num = v => { const m = String(v).replace(/,/g, '').match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
  const items = [];
  for (const row of rows.slice(h + 1)) {
    const n = String(row[cN] ?? '').trim(); if (!n || /^סה"?כ/.test(n)) continue;
    items.push({ n, c: cC >= 0 ? String(row[cC] ?? '').trim() : '', p: num(row[cP]), u: cU >= 0 ? String(row[cU] ?? '').trim() : '' });
  }
  if (h < 0 && !items.some(i => i.p != null)) throw new Error('no columns');
  return items;
}
async function readSheet(file) {
  const XLSX = await loadXlsx();
  const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
  return { date: todayISO(), items: sheetItems(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' })) };
}
async function publishPriceList() {
  const up = S.upload; if (!up) return;
  const sup = plSup(); const cur = curCat();
  const date = $('#upDate')?.value || up.date || todayISO();
  const om = {}; (cur?.items || []).forEach(i => om[norm(i.n)] = i);
  const items = buildFinal(up).map(i => { const o = om[norm(i.n)]; const it = { n: i.n, c: i.c, p: i.p ?? null, u: i.u }; if (o && o.p !== i.p && o.p != null) it.pp = o.p; return it; });
  const body = { supplier: sup, date, items, fileName: up.fileName, uploadedAt: new Date().toISOString(), prevDate: cur?.date && cur.date !== date ? cur.date : (cur?.prevDate || null) };
  const ok = await write(async db => { await db.doc('catalog/' + sup).set(body); await db.doc(`catalog/${sup}/history/${date}`).set(body); }, `המחירון של ${supName(sup)} עודכן`);
  if (ok) { S.upload = null; renderMain(); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-cat],[data-role],[data-filter]'); if (!t) return;
  if (t.dataset.role) { S.pickRole = t.dataset.role; document.querySelectorAll('.role').forEach(b => b.setAttribute('aria-pressed', b === t)); $('#pw')?.focus(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.openId = null; S.armed = null; document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b === t)); renderMain(); return; }
  if (t.dataset.cat) { S.cat = t.dataset.cat; renderList(); return; }
  if (t.dataset.filter) { S.buyFilter = t.dataset.filter; renderOrders(); return; }
  const a = t.dataset.act, k = t.dataset.k, id = t.dataset.id;
  if (a !== 'del') S.armed = null;
  const step = 1;
  switch (a) {
    case 'logout': window.appLogout?.(); store.set('mz_role', null); S.role = null; S.tab = null; S.openId = null; render(); break;
    case 'inc': setQty(k, (S.cart.lines[k]?.q || 0) + step); break;
    case 'dec': setQty(k, (S.cart.lines[k]?.q || 0) - step); break;
    case 'review': S.view = 'review'; renderMain(); window.scrollTo(0, 0); break;
    case 'back': S.view = 'list'; renderMain(); break;
    case 'clear': S.cart = emptyCart(); saveCart(); render(); toast('ההזמנה נוקתה'); break;
    case 'rm': if (k.startsWith('x:')) S.cart.extra = S.cart.extra.filter(x => 'x:' + x.id !== k); else delete S.cart.lines[k]; saveCart(); renderReview(); renderHeader(); break;
    case 'saveDraft': submitOrder(true); break;
    case 'send': submitOrder(false); break;
    case 'newOrder': S.tab = 'new'; S.view = 'list'; render(); break;
    case 'open': openOrder(id); break;
    case 'close': S.openId = null; renderMain(); break;
    case 'edit': { const o = S.orders.find(x => x.id === id); if (o) loadOrderToCart(o, false); break; }
    case 'copy': { const o = S.orders.find(x => x.id === id); if (o) loadOrderToCart(o, true); break; }
    case 'del':
      if (S.armed !== id) { S.armed = id; renderOrders(); break; }
      S.armed = null; write(db => db.doc('orders/' + id).delete(), 'הטיוטה נמחקה'); break;
    case 'handle': write(db => db.doc('orders/' + id).update({ status: 'handled', handledAt: new Date().toISOString() }), 'סומנה כטופלה'); break;
    case 'unhandle': write(db => db.doc('orders/' + id).update({ status: 'viewed', handledAt: null }), 'הוחזרה לפתוחות'); break;
    case 'xlsx': { const o = S.orders.find(x => x.id === id); if (o) exportOrders([o], `הזמנה ${o.num} אספקה ${dmy(o.delivery).replace(/\//g, '-')}.xlsx`); break; }
    case 'xlsxAll': {
      const list = (S.listShown || []).map(i => S.orders.find(o => o.id === i)).filter(Boolean);
      exportOrders(list, `הזמנות ${{ open: 'פתוחות', done: 'שטופלו', all: 'כל' }[S.buyFilter]} ${dmy(todayISO()).replace(/\//g, '-')}.xlsx`); break;
    }
    case 'waOpen': S.waPending = { id, sup: t.dataset.sup }; setTimeout(() => renderMain(), 300); break;
    case 'waNo': S.waPending = null; renderMain(); break;
    case 'supplierSent': {
      const o = S.orders.find(x => x.id === id); const sup = suppliers().find(s => s.id === S.waPending?.sup);
      S.waPending = null; if (!o) break;
      const now = new Date().toISOString(); const name = sup?.name || 'ספק';
      write(db => db.doc('orders/' + id).update({ sentTo: [...sentList(o), { name, at: now }], status: 'handled', handledAt: o.handledAt || now }), `סומנה כנשלחה ל${name}`); break;
    }
    case 'editSupplier': S.editSupplier = id; renderMain(); break;
    case 'cancelSupplier': S.editSupplier = false; renderMain(); break;
    case 'delSupplier':
      if (S.armed !== 'sup:' + id) { S.armed = 'sup:' + id; renderMain(); break; }
      S.armed = null; saveSuppliers(suppliers().filter(s => s.id !== id), 'הספק נמחק'); break;
    case 'copyText': { const o = S.orders.find(x => x.id === id); if (o) copyOrderText(o); break; }
    case 'publishPl': publishPriceList(); break;
    case 'cancelUp': S.upload = null; renderMain(); break;
    case 'upMode': if (S.upload) { S.upload.mode = t.dataset.mode; renderMain(); } break;
    case 'supSwitchYes': S.cart = { ...emptyCart(), id: S.cart.id, delivery: S.cart.delivery, notes: S.cart.notes, sup: S.pendingSup }; S.pendingSup = null; S.cat = 'הכל'; saveCart(); render(); break;
    case 'supSwitchNo': S.pendingSup = null; $('#supSwitch').innerHTML = ''; break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.qty !== undefined) { setQty(t.dataset.qty, String(t.value).replace(',', '.'), true); return; }
  if (t.id === 'q') { S.search = t.value; renderList(); return; }
  if (t.id === 'plq') { S.plSearch = t.value; renderPriceTable(); return; }
  if (t.id === 'orderNotes') { S.cart.notes = t.value; saveCart(); return; }
  if (t.dataset.note !== undefined) { const l = lineRef(t.dataset.note); if (l) { l.note = t.value; saveCart(); } return; }
  if (t.dataset.rq !== undefined) { const l = lineRef(t.dataset.rq); const v = +String(t.value).replace(',', '.'); if (l && v > 0) { l.q = v; saveCart(); renderBar(); } return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'delivery') { S.cart.delivery = t.value; saveCart(); const d = $('#deliveryDay'); if (d) d.textContent = dayName(t.value); }
  if (t.dataset.unit !== undefined) { const l = lineRef(t.dataset.unit); if (l) { l.u = t.value; saveCart(); } }
  if (t.dataset.rq !== undefined) renderReview();
  if (t.id === 'pdfIn' && t.files[0]) handleFile(t.files[0]);
  if (t.id === 'supSel') { S.supSel = t.value; S.supSelFor = S.openId; store.set('mz_sup', t.value); renderMain(); }
  if (t.id === 'cartSup') {
    if (t.value === S.cart.sup) return;
    if (Object.keys(S.cart.lines).length) { S.pendingSup = t.value; t.value = S.cart.sup; $('#supSwitch').innerHTML = supSwitchHTML(); return; }
    S.cart.sup = t.value; S.cat = 'הכל'; saveCart(); renderHeader(); renderList(); renderBar();
  }
  if (t.id === 'plSupSel') { S.plSup = t.value; S.upload = null; S.plSearch = ''; renderHeader(); renderMain(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') {
    const pw = $('#pw').value.trim();
    const enter = () => { S.role = S.pickRole || 'mz'; store.set('mz_role', S.role); S.tab = null; render(); };
    if (window.appLogin) { // standalone app: the server checks the password
      $('#pwErr').textContent = 'בודק…';
      window.appLogin(pw).then(ok => {
        if (ok === true) return enter();
        $('#pwErr').textContent = ok === 'locked' ? 'יותר מדי ניסיונות שגויים. נסו שוב בעוד 15 דקות' : ok === 'offline' ? 'אין חיבור לשרת. בדקו את האינטרנט ונסו שוב' : 'הסיסמה שגויה. נסו שוב';
      });
      return;
    }
    if (pw !== PASS) { $('#pwErr').textContent = 'הסיסמה שגויה. נסו שוב'; return; }
    enter(); return;
  }
  if (e.target.id === 'supplierForm') {
    const id = e.target.dataset.id;
    const body = { name: $('#supName').value.trim(), phone: $('#supPhone').value.trim() };
    if (!body.name) return;
    if (body.phone && waNumber(body.phone).length < 11) { toast('מספר הוואטסאפ לא תקין. כתבו מספר נייד מלא, למשל 050-1234567'); return; }
    const list = suppliers().map(s => ({ ...s }));
    if (id === 'new') list.push({ id: 's' + Date.now().toString(36), ...body });
    else { const s = list.find(x => x.id === id); if (s) Object.assign(s, body); }
    saveSuppliers(list, `${body.name} נשמר`);
    return;
  }
  if (e.target.id === 'extraForm') {
    const n = $('#exN').value.trim(), q = +$('#exQ').value.replace(',', '.');
    if (!n || !(q > 0)) return;
    S.cart.extra.push({ id: Math.random().toString(36).slice(2, 8), n, q, u: $('#exU').value, note: '' }); saveCart();
    $('#exN').value = ''; $('#exQ').value = ''; renderBar(); renderHeader(); toast(`${n} נוסף להזמנה`);
  }
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest?.('#drop'); if (!d) return;
  e.preventDefault(); d.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
}));
window.addEventListener('resize', () => renderHeader());
window.appSignedOut = () => { store.set('mz_role', null); S.role = null; S.tab = null; render(); toast('צריך להיכנס שוב'); };

render();
connect();
</script>
